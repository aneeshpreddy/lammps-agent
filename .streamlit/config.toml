# AtomForge theme (web/app.py): charcoal navy, blue/cyan accent
[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0a0e16"
secondaryBackgroundColor = "#111827"
textColor = "#e6edf7"
font = "sans serif"

[server]
headless = false
address = "localhost"          # this Mac only: generation spends the team's API credits

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"           # no Deploy button
