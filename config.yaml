# Project configuration (plan Day 5). Declared validation configurations live in configs/.
lammps:
  executable: lmp_serial          # Homebrew name on macOS (SPEC §7.11); 'lmp' on most Linux builds
  backend: local                  # local | ssh | docker
  timeout_s: 120                  # PROVISIONAL (OD-L, S-Q6)
  build_record: docs/lammps_build.txt
  ssh:                            # used only when backend: ssh (OD-F); never put passwords here
    host: null                    # e.g. user@cluster.example.edu (key-based auth)
    remote_scratch: null          # e.g. /scratch/<user>/lammps_validator
    executable: lmp
  docker:
    image: null                   # optional; skipped (plan Day 13)
    executable: lmp

validator:
  default_declared_config: configs/interface_pcff_tobermorite.yaml   # primary system class from 2026-10-19 (SPEC §7.3)
  run_tier3: true                 # Tier 3 runs whenever Tier 0 passes (PROPERTIES §8.2 item 4)
  run_tier3_full: true            # Tier 3b (full force field + run 0) when the declared config supports it

model:                            # read by agents/baseline.py (and the agent loop): change the model here only
  provider: anthropic             # anthropic (Claude API key); others to be added once model access is decided
  model_id: claude-sonnet-5-5     # Claude API ID from the models overview, 2026-11-03
  effort: medium                  # set explicitly; the same for every system
  recorded: 2026-11-03
  status: IN USE — team API credits (Claude Console), key works 2026-11-03; Sonnet 5.5 chosen (owner, 2026-11-03; a partial Opus baseline run was stopped and discarded); prices in eval/pricing.json

agent:                            # agents/loop.py (plan Days 29-33); PROVISIONAL limits, tuned on dev runs only
  max_attempts: 3                 # K: validation rounds per task (plan Day 30)
  max_steps_per_attempt: 12       # model calls per attempt
  max_tokens_per_task: 400000     # input + cache + output tokens, summed over the task
  max_wall_s: 1200                # per task
  tool_timeout_s: 300             # per tool call (a composite build takes ~11 s)
  feedback: full                  # full | tiers01 | none (ablation B: "try again" only)
  checks: false                   # variant E (agents/checks.py): dropped by the owner 2026-11-05; --system agent-checked reproduces it
  summary: false                  # build summary in build_data_file's result (--system agent-summary); dev 2026-11-05: no effect, kept off
